name: Build personal Mac app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Prepare Mac build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          python -m pip install dmgbuild Pillow
          flutter precache --macos
      - name: Build ZhenGuoJian
        run: python scripts/build_macos.py --all-sources
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-macos
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14
